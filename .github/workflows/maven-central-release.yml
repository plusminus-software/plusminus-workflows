name: Maven Central Release
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
      module:
        required: false
        type: string
        default: ""
      create-git-tag:
        required: false
        type: boolean
        default: true
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Configure Maven settings
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.3.0">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
                <repositoryOrigins>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF

      - name: Resolve target modules
        id: scope
        env:
          INPUT_MODULE: ${{ inputs.module }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # 1) An explicit module input always wins (manual, targeted release).
          if [ -n "$INPUT_MODULE" ]; then
            echo "Explicit module input: $INPUT_MODULE"
            echo "modules=$INPUT_MODULE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2) Only auto-detect on push. Anything else -> build all (empty).
          if [ "$EVENT_NAME" != "push" ]; then
            echo "No module input and event is '$EVENT_NAME' -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3) Unknown/absent base commit (first push, force-push) -> build all.
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit '$BASE_SHA' unavailable -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # 4) Root pom / build config / CI change affects everything -> build all.
          if echo "$CHANGED" | grep -qE '^(pom\.xml|\.mvn/|\.github/)'; then
            echo "Root or shared build files changed -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 5) Map each changed top-level dir that is a Maven module (has pom.xml).
          MODULES=$(echo "$CHANGED" | cut -d/ -f1 | sort -u | while read -r d; do
            if [ -n "$d" ] && [ -f "$d/pom.xml" ]; then echo "$d"; fi
          done | paste -sd, -)

          # 6) Changes but none inside a module dir -> build all to be safe.
          if [ -z "$MODULES" ]; then
            echo "No changed Maven module directories matched -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "Detected changed modules: $MODULES"
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

      # Everything below works off a "release plan": one line per Maven project
      # ("unit") with its version and the action to take for it. This lets the
      # same deploy/tag/summary steps serve all supported repository layouts:
      #   - reactor:    root pom.xml aggregates modules (units = reactor modules)
      #   - single:     root pom.xml with no <modules>   (one unit: ".")
      #   - standalone: no root pom.xml; every top-level dir with a pom.xml is an
      #                 independent Maven project          (units = those dirs)
      # Per unit: SNAPSHOT versions deploy on any trigger; non-SNAPSHOT versions
      # deploy (signed) only on a manual workflow_dispatch run.
      - name: Plan release
        id: plan
        env:
          MODULES: ${{ steps.scope.outputs.modules }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eo pipefail
          PLAN="$RUNNER_TEMP/release-plan.tsv"
          : > "$PLAN"

          if [ -f pom.xml ]; then MODE=reactor; else MODE=standalone; fi
          echo "Repository layout: $MODE"

          # Resolve the units to process (explicit/detected scope wins).
          if [ -n "$MODULES" ]; then
            IFS=',' read -ra UNITS <<< "$MODULES"
          elif [ "$MODE" == "reactor" ]; then
            # Modules declared in the root pom; none -> single project at root.
            mapfile -t UNITS < <(mvn -B -ntp -q help:evaluate -Dexpression=project.modules -DforceStdout \
              | grep -oP '(?<=<string>)[^<]+' || true)
            if [ ${#UNITS[@]} -eq 0 ]; then
              UNITS=(.)
            fi
          else
            # Alphabetical (glob) order so dependencies publish before their
            # consumers (e.g. plusminus-configs before plusminus-parent).
            UNITS=()
            for d in */; do
              d="${d%/}"
              if [ -f "$d/pom.xml" ]; then
                UNITS+=("$d")
              fi
            done
          fi

          if [ ${#UNITS[@]} -eq 0 ]; then
            echo "::error::No Maven projects found in this repository."
            exit 1
          fi

          ANY_RELEASE=false
          ANY_DEPLOY=false

          # Echo "group:artifact:version" for a unit. Kept separate so callers get the coords
          # as a return value instead of relying on a global side effect.
          coords() { # $1=pom dir, $2=version -> "group:artifact:version"
            local group artifact
            group=$(mvn -B -ntp -q -f "$1/pom.xml" help:evaluate -Dexpression=project.groupId -DforceStdout | tr -d '[:space:]')
            artifact=$(mvn -B -ntp -q -f "$1/pom.xml" help:evaluate -Dexpression=project.artifactId -DforceStdout | tr -d '[:space:]')
            printf '%s:%s:%s' "$group" "$artifact" "$2"
          }

          published_on_central() { # $1=group:artifact:version -> 0 if this exact release version is on Central
            local group artifact version
            IFS=':' read -r group artifact version <<< "$1"
            curl -sf --max-time 15 -o /dev/null \
              "https://repo1.maven.org/maven2/${group//.//}/${artifact}/${version}/${artifact}-${version}.pom"
          }

          plan_unit() { # $1=pom dir, $2=what to do if the release version is already on Central: fail|skip
            local unit="$1" on_published="$2" version action
            version=$(mvn -B -ntp -q -f "$unit/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')
            if [[ "$version" == *-SNAPSHOT ]]; then
              action=deploy-snapshot
              ANY_DEPLOY=true
            elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              # Central never accepts the same release version twice, and one
              # duplicate fails the whole upload. Check here, before anything
              # is built or published.
              local unit_coords
              unit_coords=$(coords "$unit" "$version")
              if published_on_central "$unit_coords"; then
                if [ "$on_published" == "fail" ]; then
                  echo "::error::$unit_coords is already published on Maven Central. Bump the version and try again."
                  exit 1
                fi
                action=skip-published
              else
                action=deploy-release
                ANY_RELEASE=true
                ANY_DEPLOY=true
              fi
            else
              action=skip-release
            fi
            echo "$unit ($version) -> $action"
            printf '%s\t%s\t%s\n' "$unit" "$version" "$action" >> "$PLAN"
          }

          # Reactor with modules: the root/parent pom must be published too, or
          # consumers cannot resolve the modules that inherit from it. Snapshots
          # re-upload freely; a parent release version already on Central is the
          # normal "parent unchanged" case and is skipped, not an error.
          if [ "$MODE" == "reactor" ] && [ "${UNITS[0]}" != "." ]; then
            plan_unit . skip
          fi

          for UNIT in "${UNITS[@]}"; do
            plan_unit "$UNIT" fail
          done

          {
            echo "mode=$MODE"
            echo "any_release=$ANY_RELEASE"
            echo "any_deploy=$ANY_DEPLOY"
          } >> "$GITHUB_OUTPUT"

      # Reactor layouts: build and test ALL modules together (unit + integration
      # tests) before anything is published, even when only some modules will be
      # deployed. This catches a changed module breaking an unchanged one.
      # `install` also puts every artifact into the local repository, so the
      # scoped Deploy step below needs neither `-am` nor a second test run.
      # (Standalone projects are independent — each one tests itself in Deploy.)
      - name: Build and test all modules
        if: steps.plan.outputs.mode == 'reactor' && steps.plan.outputs.any_deploy == 'true'
        run: |
          mvn -B -ntp clean install

      - name: Import GPG Key
        if: steps.plan.outputs.any_release == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Deploy
        if: steps.plan.outputs.any_deploy == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eo pipefail
          PLAN="$RUNNER_TEMP/release-plan.tsv"

          # deployAtEnd: upload only after every module in the invocation built
          # successfully, so a late failure cannot leave a half-deployed set.
          SNAPSHOT_FLAGS=(-DaltDeploymentRepository=central::default::https://central.sonatype.com/repository/maven-snapshots/ -DdeployAtEnd=true)
          RELEASE_FLAGS=(-Prelease -Dgpg.passphrase="$GPG_PASSPHRASE" -Dgpg.arguments=--pinentry-mode=loopback)

          if [ "$MODE" == "reactor" ]; then
            # One reactor invocation per action type, scoped with -pl to the
            # planned modules only. Tests already ran for the whole reactor in
            # "Build and test all modules", so they are skipped here. No -am:
            # it would pull dependency modules into the upload too (their
            # artifacts are already in the local repository from `install`).
            for ACTION in deploy-snapshot deploy-release; do
              PL=$(awk -F'\t' -v a="$ACTION" '$3==a{print $1}' "$PLAN" | paste -sd, -)
              if [ -z "$PL" ]; then continue; fi
              if [ "$ACTION" == "deploy-snapshot" ]; then FLAGS=("${SNAPSHOT_FLAGS[@]}"); else FLAGS=("${RELEASE_FLAGS[@]}"); fi
              echo "::group::Deploy ($ACTION): $PL"
              if [ "$PL" == "." ]; then
                mvn -B -ntp deploy -DskipTests "${FLAGS[@]}"
              else
                mvn -B -ntp deploy -DskipTests "${FLAGS[@]}" -pl "$PL"
              fi
              echo "::endgroup::"
            done
          else
            # Standalone: each unit is its own Maven build.
            while IFS=$'\t' read -r -u3 UNIT VERSION ACTION; do
              case "$ACTION" in
                deploy-snapshot) FLAGS=("${SNAPSHOT_FLAGS[@]}") ;;
                deploy-release)  FLAGS=("${RELEASE_FLAGS[@]}") ;;
                *) echo "Skipping $UNIT ($VERSION): non-SNAPSHOT publish requires workflow_dispatch."; continue ;;
              esac
              echo "::group::Deploy $UNIT ($VERSION)"
              mvn -B -ntp -f "$UNIT/pom.xml" clean deploy "${FLAGS[@]}"
              echo "::endgroup::"
            done 3< "$PLAN"
          fi

      - name: Tag released versions
        if: inputs.create-git-tag == true && steps.plan.outputs.any_deploy == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          SCOPE: ${{ steps.scope.outputs.modules }}
        run: |
          set -eo pipefail
          PLAN="$RUNNER_TEMP/release-plan.tsv"
          TAGS="$RUNNER_TEMP/release-tags.txt"
          : > "$TAGS"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          SHORT_SHA=$(git rev-parse --short HEAD)

          tag_name() { # $1=version -> releases tag as-is, snapshots get the commit sha
            if [[ "$1" == *-SNAPSHOT ]]; then echo "$1-$SHORT_SHA"; else echo "$1"; fi
          }

          create_tag() {
            if git rev-parse -q --verify "refs/tags/$1" >/dev/null; then
              echo "Tag $1 already exists. Skipping."
            else
              git tag -a "$1" -m "Release $1"
              git push origin "$1"
              echo "Tagged: $1"
            fi
            echo "$1" >> "$TAGS"
          }

          DEPLOYED="$RUNNER_TEMP/release-deployed.tsv"
          awk -F'\t' '$3 ~ /^deploy-/' "$PLAN" > "$DEPLOYED"

          # The reactor root/parent pom is deployed as infrastructure for its
          # modules — it does not deserve a tag of its own next to theirs.
          if [ "$(wc -l < "$DEPLOYED")" -gt 1 ]; then
            grep -v $'^\\.\t' "$DEPLOYED" > "$DEPLOYED.tmp" && mv "$DEPLOYED.tmp" "$DEPLOYED"
          fi

          UNIQ_VERSIONS=$(cut -f2 "$DEPLOYED" | sort -u | wc -l)

          # A full reactor build where every deployed module shares one version
          # gets a single unprefixed tag (classic multimodule release). Anything
          # else gets one module-prefixed tag per deployed unit, so independent
          # projects (and mixed-version reactors) never collide.
          if [ "$MODE" == "reactor" ] && [ -z "$SCOPE" ] && [ "$UNIQ_VERSIONS" -eq 1 ]; then
            create_tag "$(tag_name "$(cut -f2 "$DEPLOYED" | head -n1)")"
          else
            while IFS=$'\t' read -r -u3 UNIT VERSION ACTION; do
              TAG=$(tag_name "$VERSION")
              if [ "$UNIT" != "." ]; then TAG="${UNIT}-${TAG}"; fi
              create_tag "$TAG"
            done 3< "$DEPLOYED"
          fi

      - name: Publish job summary
        env:
          ANY_DEPLOY: ${{ steps.plan.outputs.any_deploy }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eo pipefail
          PLAN="$RUNNER_TEMP/release-plan.tsv"
          TAGS="$RUNNER_TEMP/release-tags.txt"

          if [ "$ANY_DEPLOY" == "true" ]; then
            echo "## Maven Central Publish Result 🚀" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Maven Central Publish Skipped ⏭️" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | Version | Type | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          ANY_SKIPPED=false
          while IFS=$'\t' read -r -u3 UNIT VERSION ACTION; do
            NAME=$UNIT
            if [ "$UNIT" == "." ]; then NAME="(root)"; fi
            case "$ACTION" in
              deploy-snapshot) TYPE=SNAPSHOT; STATUS=published ;;
              deploy-release)  TYPE=RELEASE;  STATUS=published ;;
              skip-published)  TYPE=RELEASE;  STATUS="already on Central" ;;
              *)               TYPE=RELEASE;  STATUS=skipped; ANY_SKIPPED=true ;;
            esac
            echo "| \`$NAME\` | $VERSION | $TYPE | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done 3< "$PLAN"

          if [ -s "$TAGS" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Git tags:** $(paste -sd, "$TAGS" | sed 's/,/, /g')" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ANY_SKIPPED" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Non-SNAPSHOT versions are only published on a manual \`workflow_dispatch\` run. This was a \`$EVENT_NAME\` run, so those projects were skipped (no publish, GPG signing, or tag)." >> "$GITHUB_STEP_SUMMARY"
          fi
